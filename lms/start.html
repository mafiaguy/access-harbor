<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <meta name="theme-color" content="#f7f8f5" />
  <meta name="robots" content="noindex,nofollow" />
  <meta name="description" content="Continue to your OpenTech Academy course." />
  <link rel="stylesheet" href="/styles.css" />
  <link rel="stylesheet" href="/brand.css" />
  <link rel="stylesheet" href="/lms.css" />
  <title>Continue to your course — OpenTech Academy</title>
</head>
<body>
  <main class="login-wrap">
    <a class="brand" href="/"><span class="brand-mark">O<span>.</span></span><span>OpenTech<span class="brand-light"> Academy</span></span></a>
    <section class="login-card" aria-live="polite">
      <div class="eyebrow" id="start-course-label">COURSE PREVIEW</div>
      <h1 id="start-course-title">Preparing your course…</h1>
      <p id="start-course-description">Sign in or create your learner account to continue to your course.</p>
      <div class="auth-mode-switch" role="group" aria-label="Account action">
        <button class="auth-mode-button is-active" type="button" id="show-sign-in" aria-pressed="true">Sign in</button>
        <button class="auth-mode-button" type="button" id="show-sign-up" aria-pressed="false">Create account</button>
      </div>
      <form id="sign-in-form" class="auth-form">
        <label for="sign-in-email">Email</label>
        <input id="sign-in-email" name="email" type="email" autocomplete="username" required />
        <label for="sign-in-password">Password</label>
        <input id="sign-in-password" name="password" type="password" autocomplete="current-password" required />
        <button class="button button-dark" type="submit">Sign in and continue <span>→</span></button>
      </form>
      <form id="sign-up-form" class="auth-form" hidden>
        <label for="sign-up-name">Name</label>
        <input id="sign-up-name" name="name" type="text" autocomplete="name" required />
        <label for="sign-up-email">Email</label>
        <input id="sign-up-email" name="email" type="email" autocomplete="email" required />
        <label for="sign-up-password">Password</label>
        <input id="sign-up-password" name="password" type="password" autocomplete="new-password" minlength="8" required />
        <button class="button button-dark" type="submit">Create account and continue <span>→</span></button>
      </form>
      <p class="auth-message" id="auth-message" role="alert" aria-live="polite"></p>
      <div class="login-disclaimer" id="auth-setup-message"><strong>Account sign-in.</strong> Your account and session are managed by OpenTech Academy.</div>
    </section>
    <a class="enroll-back" id="start-course-back" href="/#courses">← Browse courses</a>
  </main>
  <script type="module" src="/lms/start.js"></script>
</body>
</html>
